<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what lets the layout reach under the notch and the
     home indicator; styles.css then pads it back with env(safe-area-inset-*).
     The platform only injects a viewport when a page has none, so this one
     stands and must keep viewport-fit=cover. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Log</title>
<link rel="stylesheet" href="/styles.css">

<!-- DO NOT ADD A WEB APP MANIFEST OR APP ICONS HERE.
     The platform injects the install metadata at the proxy from THIS app's
     real name, with its own generated icon and colour. It backs off the
     instant a page declares a manifest link of its own, so anything static
     here would win that race and give every app the same placeholder
     identity: every install named "Your app", every home screen icon
     identical. Shipping nothing is what gets the user their own name.
     Careful: the detector greps this HTML for a manifest link, so even a
     commented-out or example one silently disables it. Do not write one.
     (Running locally there is no install metadata. That is expected; it
     appears once the app is served on *.vibekit.bot.) -->
</head>
<body>

<header class="appbar">
  <h1 id="app-name">Daily Log</h1>
  <span class="status"><span class="dot"></span>Live</span>
</header>

<main>
  <!-- One <section class="screen"> per tab. app.js just toggles .active. -->
  <section class="screen active" id="screen-home">
    <div class="card">
      <h2 id="home-date"></h2>
      <p id="home-summary">Loading today's overview...</p>
    </div>
    <div class="card">
      <h2>Quick actions</h2>
      <button class="btn" data-goto="add">+ New log entry</button>
      <button class="btn secondary" data-goto="history">View history</button>
    </div>
  </section>

  <section class="screen" id="screen-add">
    <div class="card">
      <h2>Log entry</h2>
      <form id="log-form">
        <label for="log-title">Title</label>
        <input id="log-title" type="text" placeholder="What happened?" required>
        <label for="log-notes">Notes</label>
        <textarea id="log-notes" rows="4" placeholder="Details (optional)"></textarea>
        <button class="btn" type="submit">Save entry</button>
      </form>
    </div>
  </section>

  <section class="screen" id="screen-history">
    <div class="card">
      <h2>History</h2>
      <ul class="list" id="history-list">
        <li><span>No entries yet</span></li>
      </ul>
    </div>
  </section>

  <section class="screen" id="screen-summary">
    <div class="card">
      <h2>Summary</h2>
      <ul class="list" id="summary-stats">
        <li><span>Total entries</span><span class="meta" id="stat-total">0</span></li>
        <li><span>Logged today</span><span class="meta" id="stat-today">0</span></li>
        <li><span>Logged this week</span><span class="meta" id="stat-week">0</span></li>
      </ul>
    </div>
    <footer>Built with <a href="https://vibekit.bot">VibeKit</a></footer>
  </section>
</main>

<!-- Bottom tab bar: thumb-reachable, which is where phone navigation belongs. -->
<nav class="tabbar" role="tablist">
  <button class="tab active" role="tab" data-screen="home" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </button>
  <button class="tab" role="tab" data-screen="add" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
    <span>Log</span>
  </button>
  <button class="tab" role="tab" data-screen="history" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>History</span>
  </button>
  <button class="tab" role="tab" data-screen="summary" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <span>Summary</span>
  </button>
</nav>

<script src="/app.js"></script>
</body>
</html>
